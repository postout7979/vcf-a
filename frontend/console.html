<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹 콘솔</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 36px;
        padding: 0 12px;
        background: #1b1b1b;
        border-bottom: 1px solid #333;
        font-size: 13px;
        box-sizing: border-box;
      }
      #status {
        opacity: 0.85;
        flex: 1;
      }
      #status.error {
        color: #f2799a;
      }
      #status.connected {
        color: #3cc98a;
      }
      #bar button {
        background: #2a2a2a;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #bar button:hover {
        background: #353535;
      }
      #wmksContainer {
        position: absolute;
        top: 36px;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
      }
      canvas:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="status">초기화 중...</span>
      <button id="btnCad" style="display: none">Ctrl+Alt+Del</button>
      <button id="btnFullscreen" style="display: none">전체화면</button>
    </div>
    <div id="wmksContainer"></div>
    <script type="module" src="/src/console-main.js"></script>
  </body>
</html>
