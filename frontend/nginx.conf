server {
    listen 80;
    server_name _;
    # The web console viewer (console.html) uses the browser's WebCrypto
    # API during VNC security negotiation, which only exists in a secure
    # context - redirect everything to HTTPS rather than serving the app
    # somewhere that silently breaks it.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Static SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container (service name "backend"
    # in docker-compose.yml). This replaces the dev-time Vite proxy.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
